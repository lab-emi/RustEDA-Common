[package]
name = "rusteda-rc-crossing-g1"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false

[[bin]]
name = "rusteda-rc-crossing-g1-session"
path = "src/bin/session.rs"

# Isolated component; production Common workspace/dispatch stay unchanged.
[workspace]

[dependencies]
rayon = "=1.12.0"
memmap2 = "=0.9.11"
sha2 = "=0.10.9"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = "warn"

[profile.release]
debug = "line-tables-only"
